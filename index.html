// Prefijos de config por fase
const CFG_FASE = {
  dieciseisavos:"d16", octavos:"oct", cuartos:"cua",
  semifinales:"sem", final:"fin", tercerPuesto:"ter", grupos:"g"
};

function calcPuntos(pron, res, cfg, fase) {
  if (!pron || !res) return 0;
  let pts = 0;
  const pre = CFG_FASE[fase] || "g";
  const {gl:rl, gv:rv} = res;
  const {gl:pl, gv:pv} = pron;

  if (!res.esEliminatoria) {
    // GRUPOS
    if (pl===rl && pv===rv) pts += (cfg[pre+"_marcador"]||cfg.g_marcador||5);
    else if ((rl>rv&&pl>pv)||(rl<rv&&pl<pv)||(rl===rv&&pl===pv)) pts += (cfg[pre+"_ganador"]||cfg.g_ganador||3);
  } else {
    // ELIMINATORIAS
    const glF = res.glET!==undefined ? res.glET : rl;
    const gvF = res.gvET!==undefined ? res.gvET : rv;
    const plF = pron.glFinal!==undefined ? pron.glFinal : pl;
    const pvF = pron.gvFinal!==undefined ? pron.gvFinal : pv;
    if (plF===glF && pvF===gvF) pts += (cfg[pre+"_marcador"]||4);
    const ganadorReal = res.ganadorFinal;
    if (ganadorReal && pron.ganadorFinal && ganadorReal===pron.ganadorFinal) pts += (cfg[pre+"_ganador"]||3);
  }
  return pts;
}

function calcPodios(espUser, espRes, cfg) {
  if (!espUser || !espRes) return 0;
  let pts = 0;
  if (espUser.campeon    && espRes.campeon    && espUser.campeon===espRes.campeon)       pts += (cfg.pod_campeon||15);
  if (espUser.subcampeon && espRes.subcampeon && espUser.subcampeon===espRes.subcampeon) pts += (cfg.pod_subcampeon||10);
  if (espUser.tercero    && espRes.tercero    && espUser.tercero===espRes.tercero)       pts += (cfg.pod_tercero||8);
  if (espUser.cuarto     && espRes.cuarto     && espUser.cuarto===espRes.cuarto)         pts += (cfg.pod_cuarto||6);
  if (espUser.goleador   && espRes.goleador   && espUser.goleador===espRes.goleador)     pts += (cfg.pod_goleador||10);
  if (espUser.arquero    && espRes.arquero    && espUser.arquero===espRes.arquero)       pts += (cfg.pod_arquero||10);
  if (espUser.eliminado  && espRes.eliminado  && espUser.eliminado===espRes.eliminado)   pts += (cfg.pod_eliminado||8);
  return pts;
}

  on: (path, cb) => { db.ref(path).on('value', s=>cb(s.val())); return ()=>db.ref(path).off(); },
  push: (path, val) => db.ref(path).push(val),
  update: (path, val) => db.ref(path).update(val),
  emailKey: (email) => email.replace(/\./g,'_').replace(/@/g,'__AT__'),
};

function App() {
  const [pan, setPan] = useState("login");
  const [user, setUser] = useState(null);
  const [cargando, setCargando] = useState(true);

  // Estado en Firebase
  const [usuarios, setUsuarios] = useState({});
  const [eqElim, setEqElim]    = useState({});
  const [prons, setProns]       = useState({});
  const [results, setResults]   = useState({});
  const [cfg, setCfg]           = useState(PUNTOS_DEFAULT);
  const [esp, setEsp]           = useState({});

  // Siempre generar partidos frescos con horarios oficiales (no usar caché)
  const [partidos] = useState(() => {
    const p = [...generarGrupos(),...generarElim()];
    ST.s("mw26_p", p); // Actualizar caché con horarios correctos
    return p;
  });

  // Suscribir a Firebase en tiempo real
  useEffect(() => {
    const unsubs = [];
    unsubs.push(FB.on("usuarios", v => { setUsuarios(v||{}); setCargando(false); }));
    unsubs.push(FB.on("eqElim",   v => setEqElim(v||{})));
    unsubs.push(FB.on("prons",    v => setProns(v||{})));
    unsubs.push(FB.on("results",  v => setResults(v||{})));
    unsubs.push(FB.on("cfg",      v => { if(v) setCfg(v); }));
    unsubs.push(FB.on("esp",      v => setEsp(v||{})));
    // Crear admin si no existe
    FB.get("usuarios/admin__AT__mundial2026_co").then(v => {
      if (!v) FB.set("usuarios/admin__AT__mundial2026_co", {
        nombre:"Administrador", email:"admin@mundial2026.co",
        clave:"admin2026", esAdmin:true
      });
    });
    return () => unsubs.forEach(u => u && u());
  }, []);

  const partsTodos = partidos.map(p =>
    p.esEliminatoria
      ? {...p, local:eqElim[p.id+"_L"]||null, visitante:eqElim[p.id+"_V"]||null}
      : p
  );

  function login(email, clave) {
    const key = FB.emailKey(email);
    const u = usuarios[key];
    if (!u || u.clave !== clave) return "Correo o contraseña incorrectos";
    setUser(u); setPan("app"); return null;
  }

  function registrar(nombre, email, clave) {
    const key = FB.emailKey(email);
    if (usuarios[key]) return "Este correo ya está registrado";
    if (clave.length < 6) return "La contraseña debe tener mínimo 6 caracteres";
    const u = {nombre, email, clave, esAdmin:false};
    FB.set("usuarios/"+key, u);
    setUser(u); setPan("app"); return null;
  }

  function salir() { setUser(null); setPan("login"); }

  function recuperarClave(email, callback) {
    const key = FB.emailKey(email);
    FB.get("usuarios/"+key).then(u => {
      if (!u) {
        callback("❌ No encontramos ese correo registrado.");
      } else {
        callback("✅ Tu contraseña es: " + u.clave);
      }
    });
  }

  function puedePron(p) { return true; } // MODO PRUEBA: sin restricción de fechas

  function guardarPron(pid, d) {
    const key = FB.emailKey(user.email);
    FB.set(`prons/${key}_${pid}`, d);
  }

  function guardarRes(pid, d) {
    FB.set(`results/${pid}`, d);
  }

  function asignarEq(pid, lado, eq) {
    FB.set(`eqElim/${pid}_${lado}`, eq||null);
  }

  function guardarCfg(c) {
    setCfg(c);
    FB.set("cfg", c);
  }

  function guardarEsp(fn) {
    const nuevo = fn(esp);
    FB.set("esp", nuevo);
  }

  function calcTabla() {
    const espRes = esp["__res"]||{};
    return Object.values(usuarios).filter(u=>!u.esAdmin).map(u=>{
      let pts=0;
      const key = FB.emailKey(u.email);
      partsTodos.forEach(p=>{
        pts+=calcPuntos(prons[`${key}_${p.id}`], results[p.id], cfg, p.fase);
      });
      pts += calcPodios(esp[key]||{}, espRes, cfg);
      return {...u,pts};
    }).sort((a,b)=>b.pts-a.pts);
  }

  if (cargando) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
      background:"var(--bg)",flexDirection:"column",gap:20}}>
      <div style={{fontSize:64}}>🏆</div>
      <div style={{fontFamily:"'Bebas Neue'",fontSize:32,color:"var(--gold)",letterSpacing:3}}>
        LA POLLA SÁNCHEZ
      </div>
      <div style={{color:"var(--muted)",fontSize:14}}>Conectando...</div>
      <div style={{marginTop:8,background:"rgba(231,76,60,0.15)",border:"1px solid rgba(231,76,60,0.4)",
        borderRadius:8,padding:"6px 16px"}}>
        <span style={{fontSize:12,color:"#e74c3c",fontWeight:700}}>🧪 AMBIENTE DE PRUEBA</span>
      </div>
    </div>
  );

  if (pan==="login") return <Login onLogin={login} onReg={()=>setPan("reg")} onRecuperar={recuperarClave}/>;
  if (pan==="reg")   return <Registro onReg={registrar} onVolver={()=>setPan("login")}/>;
  return (
    <Principal user={user} partidos={partsTodos} prons={prons}
      guardarPron={guardarPron} results={results} guardarRes={guardarRes}
      cfg={cfg} setCfg={guardarCfg} esp={esp} setEsp={guardarEsp}
      tabla={calcTabla()} puedePron={puedePron}
      eqElim={eqElim} asignarEq={asignarEq} onSalir={salir}/>
  );
}

// ══════════════════════════════════════════════
// REGISTRO
// ══════════════════════════════════════════════
function Registro({onReg,onVolver}) {
  const [nombre,setNombre]=useState(""); const [email,setEmail]=useState("");
  const [c1,setC1]=useState(""); const [c2,setC2]=useState(""); const [err,setErr]=useState("");
  function sub(e){
    e.preventDefault();
    if(c1!==c2){setErr("Las contraseñas no coinciden");return;}
    const r=onReg(nombre,email,c1); if(r) setErr(r);
  }
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,
      background:"radial-gradient(ellipse 100% 55% at 50% 0%,rgba(26,122,60,0.3) 0%,transparent 65%),var(--bg)"}}>
      <div style={{width:"100%",maxWidth:390}}>
        <div style={{textAlign:"center",marginBottom:26}}>
          <div style={{fontFamily:"'Bebas Neue'",fontSize:36,color:"var(--gold)",letterSpacing:3}}>LA POLLA SÁNCHEZ</div>
          <div style={{color:"var(--muted)",fontSize:11,letterSpacing:3}}>CREAR CUENTA</div>
        </div>
        <Card>
          <div style={{fontFamily:"'Barlow Condensed'",fontSize:20,fontWeight:700,marginBottom:18}}>Crea tu cuenta</div>
          <ErrBox msg={err}/>
          <form onSubmit={sub}>
            {[["Tu nombre completo","text",nombre,setNombre,"Ej: Juan Pérez"],
              ["Correo electrónico","email",email,setEmail,"tu@correo.com"],
              ["Contraseña (mín. 6 caracteres)","password",c1,setC1,"••••••"],
              ["Repetir contraseña","password",c2,setC2,"••••••"]
            ].map(([lbl,type,val,set,ph])=>(
              <div key={lbl} style={{marginBottom:13}}>
                <Lbl>{lbl}</Lbl>
                <input type={type} value={val} onChange={e=>set(e.target.value)} required placeholder={ph}/>
              </div>
            ))}
            <BtnPrimary onClick={sub} style={{width:"100%",padding:13,marginTop:6}}>Registrarme</BtnPrimary>
          </form>
          <div style={{textAlign:"center",marginTop:14}}>
            <button onClick={onVolver} style={{background:"none",border:"none",color:"var(--muted)",fontSize:13,textDecoration:"underline"}}>
              Ya tengo cuenta → Ingresar
            </button>
          </div>
        </Card>
      </div>
    </div>
  );
}

// PANTALLA PRINCIPAL

function Principal(props) {
  const {user,onSalir} = props;
  const esAdmin = !!user.esAdmin;
  const [tab,setTab] = useState("prons");

  const tabs = [
    {id:"prons",   label:"Pronósticos", icon:"⚽"},
    {id:"tabla",   label:"Polleros",    icon:"🏆"},
    {id:"esp",     label:"Especiales",  icon:"⭐"},
    ...(esAdmin?[
      {id:"res",   label:"Resultados",  icon:"📋"},
      {id:"llaves",label:"Llaves",      icon:"🔗"},
      {id:"cfg",   label:"Puntos",      icon:"⚙️"},
      {id:"users", label:"Usuarios",    icon:"👥"},

  return (
    <div style={{minHeight:"100vh",background:"var(--bg)"}}>
      {/* HEADER */}
      <div style={{background:"var(--bg2)",borderBottom:"1px solid var(--border)",position:"sticky",top:0,zIndex:99}}>

// BANNER PARTIDOS DEL DÍA
// ══════════════════════════════════════════════
function BannerHoy({partidos,prons,userEmail}) {
  const [cerrado,setCerrado] = useState(false);
  if (cerrado) return null;

  const hoy = new Date();
  const emailKey = userEmail.replace(/\./g,'_').replace(/@/g,'__AT__');
  // PRUEBA: mostrar todos los partidos sin pronóstico
  const partidosHoy = partidos.filter(p => p.local && p.visitante);
  if (partidosHoy.length === 0) return null;

  const sinPron = partidosHoy.filter(p => !prons[`${emailKey}_${p.id}`]);
  const conPron = partidosHoy.length - sinPron.length;

  return (
    <div style={{
      background:"linear-gradient(135deg,rgba(26,122,60,0.3),rgba(232,160,32,0.2))",
      border:"1px solid rgba(232,160,32,0.45)",
      borderRadius:13, padding:"14px 16px", marginBottom:20,
      position:"relative",
    }}>
      <button onClick={()=>setCerrado(true)} style={{
        position:"absolute",top:10,right:12,background:"none",border:"none",
        color:"var(--muted)",fontSize:18,lineHeight:1,padding:2,
      }}>✕</button>

      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <span style={{fontSize:28}}>📅</span>
        <div>
          <div style={{fontFamily:"'Barlow Condensed'",fontSize:18,fontWeight:700,color:"var(--gold)"}}>
            🧪 {partidosHoy.length} partido{partidosHoy.length>1?"s":""} disponibles para pronosticar
          </div>
          <div style={{fontSize:12,color:"var(--muted)"}}>
            {sinPron.length > 0
              ? `⚠️ Te faltan ${sinPron.length} pronóstico${sinPron.length>1?"s":""} por ingresar`
              : "✅ Ya tienes todos tus pronósticos de hoy guardados"}
          </div>
        </div>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {partidosHoy.map(p => {
          const tienePron = !!prons[`${emailKey}_${p.id}`];
          const abierto = true; // PRUEBA: siempre abierto
          const estado = "🧪 Prueba";

          return (
            <div key={p.id} style={{
              display:"flex",alignItems:"center",justifyContent:"space-between",
              background:"rgba(0,0,0,0.2)",borderRadius:9,padding:"9px 12px",
              border:`1px solid ${tienePron?"rgba(45,168,84,0.4)":abierto?"rgba(232,160,32,0.25)":"rgba(192,57,43,0.3)"}`,
              flexWrap:"wrap",gap:6,
            }}>
              <div style={{display:"flex",alignItems:"center",gap:8,flex:1,minWidth:0}}>
                <span style={{fontSize:13,fontWeight:600,color:"var(--text)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                  <Flag p={p.local} sz={15}/> {p.local} <span style={{color:"var(--muted)"}}>vs</span> <Flag p={p.visitante} sz={15}/> {p.visitante}
                </span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                <span style={{fontSize:11,color:"var(--muted)"}}>{estado}</span>
                <span style={{
                  fontSize:11,fontWeight:700,padding:"2px 9px",borderRadius:99,
                  background:tienePron?"rgba(45,168,84,0.2)":abierto?"rgba(232,160,32,0.15)":"rgba(192,57,43,0.15)",
                  color:tienePron?"var(--green2)":abierto?"var(--gold)":"var(--red)",
                }}>
                  {tienePron?"✓ Listo":abierto?"Pendiente":"Sin tiempo"}
                </span>
              </div>
            </div>
          );
        })}
      </div>

      {sinPron.length > 0 && (
        <div style={{marginTop:10,fontSize:12,color:"var(--gold)",textAlign:"center",fontWeight:600}}>
          ⚠️ Recuerda: el ingreso se cierra 60 minutos antes de cada partido
        </div>
      )}
    </div>
  );
}

// TAB PRONÓSTICOS
// ══════════════════════════════════════════════
function TabProns({user,partidos,prons,results,guardarPron,puedePron,cfg}) {
  const [fase,setFase]=useState("grupos");
  const [grupo,setGrupo]=useState("A");
  const fases=["grupos","dieciseisavos","octavos","cuartos","semifinales","tercerPuesto","final"];
  const lista=partidos.filter(p=>p.fase===fase&&(fase!=="grupos"||p.grupo===grupo));

  // Contadores por fase
  const conPron=(f)=>partidos.filter(p=>p.fase===f&&prons[`${user.email}_${p.id}`]).length;
  const total=(f)=>partidos.filter(p=>p.fase===f).length;

  return (
    <div>
      <Titulo>Mis Pronósticos</Titulo>
      <BannerHoy partidos={partidos} prons={prons} userEmail={user.email}/>
      {/* Fases */}
      <div className="hide-scroll" style={{display:"flex",gap:7,flexWrap:"nowrap",overflowX:"auto",marginBottom:13,paddingBottom:4}}>
        {fases.map(f=>(
          <button key={f} onClick={()=>setFase(f)} style={{
            padding:"5px 12px",borderRadius:99,fontSize:11,fontWeight:600,flexShrink:0,
            border:`1px solid ${fase===f?"var(--gold)":"var(--border)"}`,
            background:fase===f?"rgba(232,160,32,0.12)":"transparent",
            color:fase===f?"var(--gold)":"var(--muted)",
          }}>
            {FASE_LABELS[f]}
            {total(f)>0&&<span style={{marginLeft:5,fontSize:10,opacity:0.7}}>{conPron(f)}/{total(f)}</span>}
          </button>
        ))}
      </div>
      {/* Grupos */}
      {fase==="grupos"&&(
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
          {Object.keys(GRUPOS).map(g=>(
            <button key={g} onClick={()=>setGrupo(g)} style={{
              width:36,height:36,borderRadius:8,fontSize:13,fontWeight:700,
              border:`1px solid ${grupo===g?"var(--green2)":"var(--border)"}`,
              background:grupo===g?"rgba(45,168,84,0.18)":"transparent",
              color:grupo===g?"var(--green2)":"var(--muted)",
            }}>{g}</button>
          ))}
        </div>
      )}
      {/* Equipos del grupo + tabla de posiciones */}
      {fase==="grupos"&&(
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",padding:"10px 14px",
            background:"var(--bg3)",borderRadius:"10px 10px 0 0",
            borderBottom:"1px solid var(--border)"}}>
            {GRUPOS[grupo].map(eq=>(
              <span key={eq} style={{fontSize:13,color:"var(--text)"}}>
                <Flag p={eq} sz={16}/> {eq}
              </span>
            ))}
          </div>
          <TablaGrupo grupo={grupo} partidos={partidos} resultados={results}/>
        </div>
      )}
      <div style={{display:"flex",flexDirection:"column",gap:11}}>
        {lista.length===0
          ? <div style={{textAlign:"center",color:"var(--muted)",padding:40}}>No hay partidos en esta fase aún</div>
          : lista.map(p=>(
            <TarjetaPron key={p.id} partido={p}
              pron={prons[`${user.email.replace(/\./g,'_').replace(/@/g,'__AT__')}_${p.id}`]}
              res={results[p.id]}
              puedo={puedePron(p)}
              onGuardar={d=>guardarPron(p.id,d)}
              cfg={cfg}/>
          ))
        }
      </div>
    </div>
  );
}

function TarjetaPron({partido,pron,res,puedo,onGuardar,cfg}) {
  const [gl,setGl]=useState(pron?.gl??"");
  const [gv,setGv]=useState(pron?.gv??"");
  const [glET,setGlET]=useState(pron?.glET??"");
  const [gvET,setGvET]=useState(pron?.gvET??"");
  const [pen,setPen]=useState(pron?.ganadorPenales??"");
  const [edit,setEdit]=useState(false);
  const [ok,setOk]=useState(false);

  const hayRes=!!res; const hasPron=!!pron;
  const eqL=partido.local||"Por definir";
  const eqV=partido.visitante||"Por definir";
  const esElim=!!partido.esEliminatoria;
  const emp90=gl!==""&&gv!==""&&parseInt(gl)===parseInt(gv);
  const empET=glET!==""&&gvET!==""&&parseInt(glET)===parseInt(gvET);
  const pts=hayRes&&hasPron?calcPuntos(pron,res,cfg):null;

  const fecha = "PRUEBA"; // Fecha oculta en ambiente de prueba

  function guardar(){
    if(gl===""||gv==="") return;
    const d={gl:parseInt(gl),gv:parseInt(gv)};
    if(esElim){
      if(glET!==""&&gvET!==""){d.glFinal=parseInt(glET);d.gvFinal=parseInt(gvET);}
      else{d.glFinal=parseInt(gl);d.gvFinal=parseInt(gv);}
      if(pen) d.ganadorFinal=pen===eqL?"L":"V";
    }
    onGuardar(d); setOk(true); setEdit(false);
    setTimeout(()=>setOk(false),2200);
  }

  const mostrar=puedo&&(!hasPron||edit);
  const acento=hayRes?"rgba(45,168,84,0.35)":hasPron?"rgba(232,160,32,0.28)":"var(--border)";
  const barraColor=hayRes?"var(--green2)":hasPron?"var(--gold)":"var(--border)";

  return (
    <div style={{background:"var(--card)",border:`1px solid ${acento}`,borderRadius:12,
      padding:"13px 14px",borderLeft:`3.5px solid ${barraColor}`}}>
      {/* Cabecera */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{fontSize:12,color:"var(--text)",letterSpacing:0.4,fontWeight:600}}>
          {partido.grupo?`GRUPO ${partido.grupo} · `:""}{FASE_LABELS[partido.fase].toUpperCase()}
        </span>
        {pts!==null&&(
          <span style={{fontSize:13,fontWeight:700,color:pts>0?"var(--gold)":"var(--muted)",
            background:"rgba(232,160,32,0.08)",padding:"1px 8px",borderRadius:99}}>
            {pts} pts
          </span>
        )}
      </div>

      {/* Marcador */}
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        {/* Local */}
        <div style={{flex:1,textAlign:"right"}}>
          <div><Flag p={eqL} sz={24}/></div>
          <div style={{fontSize:12,fontWeight:600,color:"var(--text)",marginTop:2,lineHeight:1.2}}>{eqL}</div>
        </div>

        {/* Centro */}
        <div style={{textAlign:"center",minWidth:105}}>
          {hayRes?(
            <div style={{fontFamily:"'Bebas Neue'",fontSize:36,color:"var(--green2)",letterSpacing:3,lineHeight:1}}>{res.gl} – {res.gv}</div>
          ):hasPron&&!edit?(
            <div style={{fontFamily:"'Bebas Neue'",fontSize:36,color:"var(--gold)",letterSpacing:3,lineHeight:1}}>{pron.gl} – {pron.gv}</div>
          ):mostrar?(
            <div style={{display:"flex",alignItems:"center",gap:5,justifyContent:"center"}}>
              <NumIn value={gl} onChange={setGl}/>
              <span style={{color:"var(--muted)",fontWeight:700,fontSize:18}}>–</span>
              <NumIn value={gv} onChange={setGv}/>
            </div>
          ):(
            <div style={{fontFamily:"'Bebas Neue'",fontSize:30,color:"rgba(255,255,255,0.12)",letterSpacing:3}}>? – ?</div>
          )}
          <div style={{fontSize:9,color:"var(--muted)",letterSpacing:0.4,marginTop:3}}>
            {hayRes?"RESULTADO OFICIAL":hasPron&&!edit?"TU PRONÓSTICO":"90 MIN"}
          </div>
        </div>

        {/* Visitante */}
        <div style={{flex:1,textAlign:"left"}}>
          <div><Flag p={eqV} sz={24}/></div>
          <div style={{fontSize:12,fontWeight:600,color:"var(--text)",marginTop:2,lineHeight:1.2}}>{eqV}</div>
        </div>
      </div>

      {/* ELIMINATORIAS: marcador final + quién avanza */}
      {mostrar&&esElim&&(
        <div style={{marginTop:12,background:"var(--bg3)",borderRadius:9,padding:"12px 13px"}}>
          <div style={{fontSize:11,color:"var(--gold)",fontWeight:700,letterSpacing:0.5,marginBottom:10}}>
            ⏱ ELIMINATORIA — RESULTADO FINAL (incluyendo tiempo extra si lo hay)
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6,justifyContent:"center",marginBottom:4}}>
            <NumIn value={glET} onChange={setGlET} style={{fontSize:18}}/>
            <span style={{color:"var(--muted)",fontWeight:700}}>–</span>
            <NumIn value={gvET} onChange={setGvET} style={{fontSize:18}}/>
          </div>
          <div style={{fontSize:10,color:"var(--muted)",textAlign:"center",marginBottom:12}}>
            Si el partido termina en 90 min, pon el mismo marcador de arriba
          </div>
          <div style={{fontSize:11,color:"#e74c3c",fontWeight:700,letterSpacing:0.5,marginBottom:8}}>
            🏆 ¿QUIÉN AVANZA? (puede ser por goles, tiempo extra o penaltis)
          </div>
          <div style={{display:"flex",gap:8}}>
            {[eqL,eqV].map(eq=>(
              <button key={eq} onClick={()=>setPen(eq===pen?"":eq)} style={{
                flex:1,padding:"8px 6px",borderRadius:8,fontSize:12,fontWeight:600,
                border:`1px solid ${pen===eq?"#e74c3c":"var(--border)"}`,
                background:pen===eq?"rgba(231,76,60,0.18)":"transparent",
                color:pen===eq?"#e74c3c":"var(--muted)",
              }}><Flag p={eq} sz={15}/> {eq}</button>
            ))}
          </div>
        </div>
      )}

      {/* Resultado oficial eliminatoria */}
      {hayRes&&esElim&&(
        <div style={{marginTop:10,background:"var(--bg3)",borderRadius:8,padding:"9px 12px",fontSize:13}}>
          {res.glET!==undefined&&<span style={{color:"var(--muted)"}}>T. Extra: <b style={{color:"var(--green2)",fontFamily:"'Bebas Neue'",fontSize:16}}>{res.glET}–{res.gvET}</b> · </span>}
          {res.ganadorFinal&&<span style={{color:"var(--muted)"}}>Avanza: <b style={{color:"var(--green2)"}}><Flag p={res.ganadorFinal==="L"?eqL:eqV} sz={13}/> {res.ganadorFinal==="L"?eqL:eqV}</b></span>}
        </div>
      )}

      {/* Pronóstico eliminatoria guardado */}
      {hasPron&&!edit&&!hayRes&&esElim&&(pron.glFinal!==undefined||pron.ganadorFinal)&&(
        <div style={{marginTop:8,background:"rgba(232,160,32,0.06)",borderRadius:8,padding:"7px 11px",fontSize:12}}>
          {pron.glFinal!==undefined&&<span style={{color:"var(--muted)"}}>Tu resultado final: <b style={{color:"var(--gold)",fontFamily:"'Bebas Neue'",fontSize:16}}>{pron.glFinal}–{pron.gvFinal}</b> · </span>}
          {pron.ganadorFinal&&<span style={{color:"var(--muted)"}}>Tu avanza: <b style={{color:"var(--gold)"}}>{pron.ganadorFinal==="L"?eqL:eqV}</b></span>}
        </div>
      )}

      {/* Acciones */}
      {!hayRes&&(
        <div style={{marginTop:11,display:"flex",gap:8,justifyContent:"flex-end",alignItems:"center"}}>
          {hasPron&&!edit&&puedo&&(
            <BtnSec onClick={()=>setEdit(true)} style={{fontSize:12,padding:"6px 13px"}}>Editar</BtnSec>
          )}
          {mostrar&&(
            <BtnPrimary onClick={guardar} disabled={gl===""||gv===""} style={{fontSize:12,padding:"7px 16px"}}>
              {ok?"✓ Guardado":"Guardar pronóstico"}
            </BtnPrimary>
          )}
          {!puedo&&!hayRes&&(
            <span style={{fontSize:11,color:"var(--red)"}}>⏰ Tiempo cerrado</span>
          )}
        </div>
      )}
    </div>
  );
}

// TAB ESPECIALES
// ══════════════════════════════════════════════
function TabEsp({user,esp,setEsp,esAdmin,cfg}) {
  const key_esp = user.email.replace(/\./g,'_').replace(/@/g,'__AT__');
  const mis=esp[key_esp]||{};
  const espRes=esp["__res"]||{};
  const [maxG,setMaxG]=useState(mis.maxGoleador||"");
  const [arq,setArq]=useState(mis.arquero||"");
  const [camp,setCamp]=useState(mis.campeon||"");
  const [ok,setOk]=useState(false);
  const [rMG,setRMG]=useState(espRes.maxGoleador||"");
  const [rArq,setRArq]=useState(espRes.arquero||"");
  const [rCamp,setRCamp]=useState(espRes.campeon||"");
  const [okA,setOkA]=useState(false);

  function guardar(){
    const key = user.email.replace(/\./g,'_').replace(/@/g,'__AT__');
    setEsp(p=>({...p,[key]:{maxGoleador:maxG,arquero:arq,campeon:camp}}));
    setOk(true); setTimeout(()=>setOk(false),2200);
  }
  function guardarAdmin(){
    setEsp(p=>({...p,__res:{maxGoleador:rMG,arquero:rArq,campeon:rCamp}}));
    setOkA(true); setTimeout(()=>setOkA(false),2200);
  }

  const items=[
    {lbl:"⚽ Máximo Goleador del Torneo",val:maxG,set:setMaxG,pts:cfg.maxGoleador,tipo:"txt",ph:"Nombre del jugador",res:espRes.maxGoleador},
    {lbl:"🧤 Arquero del Torneo (Guante de Oro)",val:arq,set:setArq,pts:cfg.arqueroTorneo,tipo:"txt",ph:"Nombre del portero",res:espRes.arquero},
    {lbl:"🏆 Campeón del Mundial",val:camp,set:setCamp,pts:cfg.campeon,tipo:"sel",res:espRes.campeon},
  ];

  return (
    <div>
      <Titulo>Pronósticos Especiales</Titulo>
      <p style={{color:"var(--muted)",fontSize:13,marginBottom:18}}>Se evalúan al final del torneo. ¡Puntos extra en juego!</p>
      {ok&&<OkMsg msg="✓ Tus pronósticos especiales fueron guardados"/>}
      <div style={{display:"flex",flexDirection:"column",gap:11,marginBottom:20}}>
        {items.map((c,i)=>(
          <Card key={i}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:11}}>
              <span style={{fontSize:14,fontWeight:600,flex:1}}>{c.lbl}</span>
              <span style={{fontSize:11,background:"rgba(45,168,84,0.14)",color:"var(--green2)",
                padding:"2px 10px",borderRadius:99,fontWeight:600,flexShrink:0,marginLeft:8}}>+{c.pts} pts</span>
            </div>
            {c.tipo==="sel"?(
              <select value={c.val} onChange={e=>c.set(e.target.value)}>
                <option value="">— Selecciona el campeón —</option>
                {TODOS.map(eq=><option key={eq} value={eq}>{BANDERAS[eq]} {eq}</option>)}
              </select>
            ):(
              <input type="text" value={c.val} onChange={e=>c.set(e.target.value)} placeholder={c.ph}/>
            )}
            {c.res&&(
              <div style={{marginTop:8,fontSize:12,color:c.val===c.res?"var(--green2)":"var(--muted)"}}>
                {c.val===c.res?"🎉 ¡Acertaste! ":""}Oficial: <b>{c.res}</b>
              </div>
            )}
          </Card>
        ))}
      </div>
      <BtnPrimary onClick={guardar} style={{padding:"11px 26px"}}>Guardar pronósticos especiales</BtnPrimary>

      {esAdmin&&(
        <div style={{marginTop:34,background:"rgba(232,160,32,0.05)",border:"1px solid rgba(232,160,32,0.18)",borderRadius:12,padding:18}}>
          <div style={{fontFamily:"'Barlow Condensed'",fontSize:18,color:"var(--gold)",marginBottom:14}}>⚙️ Admin: Resultados oficiales especiales</div>
          {okA&&<OkMsg msg="✓ Resultados oficiales guardados"/>}
          <div style={{marginBottom:12}}><Lbl>Máximo Goleador oficial</Lbl><input type="text" value={rMG} onChange={e=>setRMG(e.target.value)} placeholder="Nombre del goleador"/></div>
          <div style={{marginBottom:12}}><Lbl>Arquero del Torneo oficial</Lbl><input type="text" value={rArq} onChange={e=>setRArq(e.target.value)} placeholder="Nombre del arquero"/></div>
          <div style={{marginBottom:16}}><Lbl>Campeón oficial</Lbl>
            <select value={rCamp} onChange={e=>setRCamp(e.target.value)}>
              <option value="">— Seleccionar —</option>
              {TODOS.map(eq=><option key={eq} value={eq}>{BANDERAS[eq]} {eq}</option>)}
            </select>
          </div>
          <BtnGold onClick={guardarAdmin} style={{padding:"9px 22px"}}>Guardar resultados oficiales</BtnGold>
        </div>
      )}
    </div>
  );
}

function TabRes({partidos,results,guardarRes}) {
  const [fase,setFase]=useState("grupos");
  const [grupo,setGrupo]=useState("A");
  const fases=["grupos","dieciseisavos","octavos","cuartos","semifinales","tercerPuesto","final"];
  const lista=partidos.filter(p=>p.fase===fase&&(fase!=="grupos"||p.grupo===grupo));

  return (
    <div>
      <Titulo>Ingresar Resultados Oficiales</Titulo>
      <div className="hide-scroll" style={{display:"flex",gap:7,flexWrap:"nowrap",overflowX:"auto",marginBottom:13,paddingBottom:4}}>
        {fases.map(f=>(
          <button key={f} onClick={()=>setFase(f)} style={{
            padding:"5px 12px",borderRadius:99,fontSize:11,fontWeight:600,flexShrink:0,
            border:`1px solid ${fase===f?"var(--gold)":"var(--border)"}`,
            background:fase===f?"rgba(232,160,32,0.12)":"transparent",
            color:fase===f?"var(--gold)":"var(--muted)",
          }}>{FASE_LABELS[f]}</button>
        ))}
      </div>
      {fase==="grupos"&&(
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
          {Object.keys(GRUPOS).map(g=>(
            <button key={g} onClick={()=>setGrupo(g)} style={{
              width:36,height:36,borderRadius:8,fontSize:13,fontWeight:700,
              border:`1px solid ${grupo===g?"var(--green2)":"var(--border)"}`,
              background:grupo===g?"rgba(45,168,84,0.18)":"transparent",
              color:grupo===g?"var(--green2)":"var(--muted)",
            }}>{g}</button>
          ))}
        </div>
      )}
      <div style={{display:"flex",flexDirection:"column",gap:9}}>
        {lista.length===0
          ? <div style={{color:"var(--muted)",textAlign:"center",padding:30}}>Sin partidos en esta fase aún</div>
          : lista.map(p=><FormRes key={p.id} partido={p} res={results[p.id]} onGuardar={d=>guardarRes(p.id,d)}/>)
        }
      </div>
    </div>
  );
}

function FormRes({partido,res,onGuardar}) {
  const [gl,setGl]=useState(res?.gl??""); const [gv,setGv]=useState(res?.gv??"");
  const [glET,setGlET]=useState(res?.glET??""); const [gvET,setGvET]=useState(res?.gvET??"");
  const [pen,setPen]=useState(res?.ganadorPenales??""); const [ok,setOk]=useState(false);
  const eqL=partido.local||"Por definir"; const eqV=partido.visitante||"Por definir";
  const esElim=!!partido.esEliminatoria;
  const emp90=gl!==""&&gv!==""&&parseInt(gl)===parseInt(gv);
  const empET=glET!==""&&gvET!==""&&parseInt(glET)===parseInt(gvET);

  function guardar(){
    if(gl===""||gv==="") return;
    const d={gl:parseInt(gl),gv:parseInt(gv),esEliminatoria:esElim};
    if(esElim){
      d.glET=glET!==""?parseInt(glET):parseInt(gl);
      d.gvET=gvET!==""?parseInt(gvET):parseInt(gv);
      if(pen) d.ganadorFinal=pen===eqL?"L":"V";
    }
    onGuardar(d); setOk(true); setTimeout(()=>setOk(false),2200);
  }

  return (
    <Card borde={res?"rgba(45,168,84,0.3)":"var(--border)"}>
      <div style={{fontSize:12,color:"var(--text)",fontWeight:600,marginBottom:10,display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
        <span>{partido.grupo?`GRUPO ${partido.grupo} · `:""}{FASE_LABELS[partido.fase]}</span>
        {res&&<span style={{color:"var(--green2)"}}>✓ Resultado ingresado</span>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <div style={{flex:1,textAlign:"right",minWidth:90,fontSize:13,fontWeight:600}}>
          <Flag p={eqL} sz={16}/> {eqL}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <NumIn value={gl} onChange={setGl}/>
          <span style={{color:"var(--muted)",fontWeight:700}}>–</span>
          <NumIn value={gv} onChange={setGv}/>
        </div>
        <div style={{flex:1,textAlign:"left",minWidth:90,fontSize:13,fontWeight:600}}>
          <Flag p={eqV} sz={16}/> {eqV}
        </div>
        <BtnPrimary onClick={guardar} disabled={gl===""||gv===""} style={{fontSize:12,padding:"7px 14px"}}>
          {ok?"✓":"Guardar"}
        </BtnPrimary>
      </div>
      {esElim&&(
        <div style={{marginTop:11,background:"var(--bg3)",borderRadius:8,padding:"11px 13px"}}>
          <div style={{fontSize:11,color:"var(--gold)",fontWeight:700,marginBottom:8}}>
            ⏱ RESULTADO FINAL (con tiempo extra si hubo)
          </div>
          <div style={{display:"flex",alignItems:"center",gap:7,justifyContent:"center",marginBottom:10}}>
            <NumIn value={glET} onChange={setGlET} style={{fontSize:18}}/>
            <span style={{color:"var(--muted)",fontWeight:700}}>–</span>
            <NumIn value={gvET} onChange={setGvET} style={{fontSize:18}}/>
          </div>
          <div style={{fontSize:10,color:"var(--muted)",marginBottom:10}}>
            Si no hubo tiempo extra, dejar igual que el marcador de 90 min
          </div>
          <div style={{fontSize:11,color:"#e74c3c",fontWeight:700,marginBottom:8}}>
            🏆 ¿QUIÉN AVANZA? (goles, tiempo extra o penaltis)
          </div>
          <div style={{display:"flex",gap:8}}>
            {[eqL,eqV].map(eq=>(
              <button key={eq} onClick={()=>setPen(eq===pen?"":eq)} style={{
                flex:1,padding:"7px",borderRadius:8,fontSize:12,fontWeight:600,
                border:`1px solid ${pen===eq?"#e74c3c":"var(--border)"}`,
                background:pen===eq?"rgba(231,76,60,0.18)":"transparent",
                color:pen===eq?"#e74c3c":"var(--muted)",
              }}><Flag p={eq} sz={14}/> {eq}</button>
            ))}
          </div>
        </div>
      )}
    </Card>
  );
}

                  <div style={{fontSize:10,color:"var(--muted)",marginBottom:8,display:"flex",justifyContent:"space-between"}}>
                    <span>PARTIDO {p.partido}</span>
                    {results[p.id]&&<span style={{color:"var(--green2)"}}>✓ Con resultado</span>}
                  </div>
                  <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                    <select value={eqElim[`${p.id}_L`]||""} onChange={e=>asignarEq(p.id,"L",e.target.value)} style={{flex:1,minWidth:130}}>
                      <option value="">— Equipo Local —</option>
                      {TODOS.map(eq=><option key={eq} value={eq}>{BANDERAS[eq]} {eq}</option>)}
                    </select>
                    <span style={{color:"var(--muted)",fontWeight:700,flexShrink:0}}>vs</span>
                    <select value={eqElim[`${p.id}_V`]||""} onChange={e=>asignarEq(p.id,"V",e.target.value)} style={{flex:1,minWidth:130}}>
                      <option value="">— Equipo Visitante —</option>
                      {TODOS.map(eq=><option key={eq} value={eq}>{BANDERAS[eq]} {eq}</option>)}
                    </select>
                  </div>
                  {(eqElim[`${p.id}_L`]||eqElim[`${p.id}_V`])&&(
                    <div style={{marginTop:9,display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:"var(--bg3)",borderRadius:8}}>
                      {eqElim[`${p.id}_L`]&&<span style={{fontSize:13}}><Flag p={eqElim[`${p.id}_L`]} sz={18}/> {eqElim[`${p.id}_L`]}</span>}
                      {eqElim[`${p.id}_L`]&&eqElim[`${p.id}_V`]&&<span style={{color:"var(--muted)"}}>vs</span>}
                      {eqElim[`${p.id}_V`]&&<span style={{fontSize:13}}><Flag p={eqElim[`${p.id}_V`]} sz={18}/> {eqElim[`${p.id}_V`]}</span>}
                    </div>
                  )}
                </Card>
              ))}
              {ps.length===0&&<div style={{color:"var(--muted)",fontSize:13}}>Sin partidos generados</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ══════════════════════════════════════════════
// TAB CONFIG (ADMIN)
// ══════════════════════════════════════════════
function TabCfg({cfg,setCfg}) {
  const [local,setLocal] = useState({...PUNTOS_DEFAULT,...cfg});
  const [ok,setOk]       = useState(false);
  function save(){ setCfg(local); setOk(true); setTimeout(()=>setOk(false),2500); }

  const Spinner = ({k}) => (
    <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
      <button onClick={()=>setLocal(p=>({...p,[k]:Math.max(0,(p[k]||0)-1)}))}
        style={{width:28,height:28,borderRadius:6,background:"var(--bg3)",border:"1px solid var(--border)",color:"var(--text)",fontSize:16}}>−</button>
      <span style={{fontFamily:"'Bebas Neue'",fontSize:24,color:"var(--gold)",minWidth:26,textAlign:"center"}}>{local[k]||0}</span>
      <button onClick={()=>setLocal(p=>({...p,[k]:(p[k]||0)+1}))}
        style={{width:28,height:28,borderRadius:6,background:"var(--bg3)",border:"1px solid var(--border)",color:"var(--text)",fontSize:16}}>+</button>
    </div>
  );

  const Fila = ({ic,lbl,k}) => (
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",
      background:"var(--card)",borderRadius:9,border:"1px solid var(--border)"}}>
      <span style={{fontSize:18,flexShrink:0}}>{ic}</span>
      <div style={{flex:1,fontSize:13,color:"var(--text)"}}>{lbl}</div>
      <Spinner k={k}/>
    </div>
  );

  const SecTitle = ({children}) => (
    <div style={{fontFamily:"'Barlow Condensed'",fontSize:16,color:"var(--gold)",
      marginTop:20,marginBottom:8,paddingBottom:6,borderBottom:"1px solid var(--border)"}}>
      {children}
    </div>
  );

  return (
    <div>
      <Titulo>Configuración de Puntos</Titulo>
      <p style={{color:"var(--muted)",fontSize:13,marginBottom:4}}>
        El administrador define los puntos para cada categoría y fase.
      </p>
      {ok&&<OkMsg msg="✓ Configuración guardada correctamente"/>}

      <SecTitle>⚽ FASE DE GRUPOS</SecTitle>
      <Fila ic="🎯" lbl="Marcador exacto a 90 minutos"        k="g_marcador"/>
      <Fila ic="✅" lbl="Ganador del partido"                  k="g_ganador"/>

      <SecTitle>🔗 DIECISEISAVOS DE FINAL</SecTitle>
      <Fila ic="🎯" lbl="Resultado final exacto (con TE si hubo)" k="d16_marcador"/>
      <Fila ic="✅" lbl="Quién avanza (goles, TE o penaltis)"      k="d16_ganador"/>

      <SecTitle>🔗 OCTAVOS DE FINAL</SecTitle>
      <Fila ic="🎯" lbl="Resultado final exacto"  k="oct_marcador"/>
      <Fila ic="✅" lbl="Quién avanza"             k="oct_ganador"/>

      <SecTitle>🔗 CUARTOS DE FINAL</SecTitle>
      <Fila ic="🎯" lbl="Resultado final exacto"  k="cua_marcador"/>
      <Fila ic="✅" lbl="Quién avanza"             k="cua_ganador"/>

      <SecTitle>🔗 SEMIFINALES</SecTitle>
      <Fila ic="🎯" lbl="Resultado final exacto"  k="sem_marcador"/>
      <Fila ic="✅" lbl="Quién avanza"             k="sem_ganador"/>

      <SecTitle>🔗 FINAL</SecTitle>
      <Fila ic="🎯" lbl="Resultado final exacto"  k="fin_marcador"/>
      <Fila ic="✅" lbl="Campeón (quién gana la final)" k="fin_ganador"/>

      <SecTitle>🔗 TERCER PUESTO</SecTitle>
      <Fila ic="🎯" lbl="Resultado final exacto"  k="ter_marcador"/>
      <Fila ic="✅" lbl="Quién gana"               k="ter_ganador"/>

      <SecTitle>🏅 PODIOS ESPECIALES</SecTitle>
      <Fila ic="🏆" lbl="Campeón del Mundial"                           k="pod_campeon"/>
      <Fila ic="🥈" lbl="Subcampeón (finalista perdedor)"               k="pod_subcampeon"/>
      <Fila ic="🥉" lbl="Tercer Puesto"                                 k="pod_tercero"/>
      <Fila ic="4️⃣"  lbl="Cuarto Puesto"                               k="pod_cuarto"/>
      <Fila ic="👟" lbl="Goleador del Mundial"                          k="pod_goleador"/>
      <Fila ic="🧤" lbl="Arquero del Mundial (Guante de Oro)"           k="pod_arquero"/>
      <Fila ic="💣" lbl="Equipo favorito eliminado en fase de grupos"   k="pod_eliminado"/>

      <div style={{marginTop:20}}>
        <BtnGold onClick={save} style={{padding:"11px 28px"}}>
          Guardar configuración de puntos
        </BtnGold>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
// TAB USUARIOS (ADMIN)
// ══════════════════════════════════════════════
function TabUsers({usuarios}) {
  return (
    <div>
      <Titulo>Participantes Registrados</Titulo>
      <p style={{color:"var(--muted)",fontSize:13,marginBottom:18}}>
        {usuarios.length} participante{usuarios.length!==1?"s":""} registrado{usuarios.length!==1?"s":""}
      </p>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {usuarios.map((u,i)=>(
          <Card key={u.email}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:38,height:38,borderRadius:"50%",background:"var(--bg3)",
                display:"flex",alignItems:"center",justifyContent:"center",
                fontFamily:"'Bebas Neue'",fontSize:18,color:"var(--muted)",flexShrink:0}}>
                {i+1}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:600,color:"var(--text)"}}>{u.nombre}</div>
                <div style={{fontSize:11,color:"var(--muted)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.email}</div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontFamily:"'Bebas Neue'",fontSize:24,color:"var(--gold)"}}>{u.pts}</div>
                <div style={{fontSize:9,color:"var(--muted)",letterSpacing:1}}>PTS</div>
              </div>
            </div>
          </Card>
        ))}
        {usuarios.length===0&&<div style={{color:"var(--muted)",textAlign:"center",padding:30}}>Sin participantes aún</div>}
      </div>
    </div>
  );
}
